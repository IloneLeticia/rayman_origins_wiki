<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayman Origins Archive - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="inicial.css"> </head>
<body>

    <header>
        <p>RAYMAN ORIGINS WIKI</p>
    </header>

    <main id="tela" class="my-auto">
        <div class="boas-vindas mb-4">
            <h2>🔑 Fazer Login</h2>
            <p>Entre para gerenciar seus favoritos!</p>
        </div>

        <form id="formLogin" class="text-start">
            <div class="mb-3">
                <label for="loginUsuario" class="form-label font-weight-bold">Usuário:</label>
                <input type="text" class="form-control rounded-pill" id="loginUsuario" required placeholder="Digite seu usuário">
            </div>
            
            <div class="mb-4">
                <label for="loginSenha" class="form-label font-weight-bold">Senha:</label>
                <input type="password" class="form-control rounded-pill" id="loginSenha" required placeholder="Digite sua senha">
            </div>

            <div class="grupo-botoes">
                <button type="submit" class="w-100">ENTRAR</button>
                <a href="cadastro.html" class="btn btn-link text-decoration-none small text-center mt-2" style="color: #ff1493;">Não tem conta? Cadastre-se</a>
                <a href="inicial.html" class="btn btn-link text-decoration-none small text-center text-secondary">Voltar para a Home</a>
            </div>
        </form>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto w-100">
        <p>&copy; 2026 - Ilone Letícia - Fins acadêmicos.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   
    <script src="js/app.js"></script>
    
    <script src="js/auth.js"></script>

</body>
</html>
