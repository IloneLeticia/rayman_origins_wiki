<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayman Origins Archive - Gerenciar Itens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="inicial.css">
</head>
<body>

    <header>
        <p>RAYMAN ORIGINS WIKI - PAINEL ADM</p>
       
    </header>

    <main class="container my-5">
        <div class="row">
            <section class="col-lg-4 mb-4">
                <div id="tela" class="w-100 text-start" style="max-width: 100%; padding: 30px 20px;">
                    <div class="boas-vindas text-center mb-3">
                        <h2 id="tituloForm">✨ Novo Item</h2>
                        <p>Gerencie subitens nas categorias do Local Storage</p>
                    </div>

                    <form id="formItemCRUD">
                        <input type="hidden" id="itemId">

                        <div class="mb-3">
                            <label for="selectCategoria" class="form-label font-weight-bold">Selecione a Categoria:</label>
                            <select class="form-select rounded-pill" id="selectCategoria">
                                <option value="1" selected>Heróis</option>
                                <option value="2">Mundos</option>
                                <option value="3">Inimigos</option>
                                <option value="4">NPCs</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nomeCategoria" class="form-label font-weight-bold">Nome:</label>
                            <input type="text" class="form-control rounded-pill" id="nomeCategoria" required placeholder="Ex: Rayman, Livid Dead...">
                        </div>

                        <div class="mb-3">
                            <label for="imagemCard" class="form-label font-weight-bold">Aparência (URL Imagem 1):</label>
                            <input type="text" class="form-control rounded-pill" id="imagemCard" required placeholder="imagens/foto1.png">
                        </div>

                        <div class="mb-3">
                            <label for="breveDescricao" class="form-label font-weight-bold">Descrição:</label>
                            <textarea class="form-control" id="breveDescricao" rows="3" required placeholder="Escreva os detalhes..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="imagemCarrossel" class="form-label font-weight-bold">2ª Imagem (URL Opcional):</label>
                            <input type="text" class="form-control rounded-pill" id="imagemCarrossel" placeholder="imagens/foto2.png">
                        </div>

                        <div class="grupo-botoes">
                            <button type="submit" class="w-100" id="btnSalvarCRUD">SALVAR INFORMAÇÕES</button>
                            <button type="button" class="w-100 btn btn-secondary text-white d-none mt-2" id="btnCancelarEdicao" style="border-radius: 30px;">CANCELAR EDIÇÃO</button>
                            <a href="index.html" class="btn btn-link text-decoration-none small text-center text-secondary w-100 mt-2">Voltar para a Home</a>
                        </div>
                    </form>
                </div>
            </section>

            <button type="button" id="btnResetarJSON" class="btn btn-outline-danger btn-sm w-100 mt-4" style="border-radius: 30px;">
    🔄 RESETAR DADOS PARA O PADRÃO (JSON)
</button>

            <section class="col-lg-8">
                <div class="bg-white p-4 rounded shadow border">
                    <h3 class="mb-4 text-dark font-weight-bold" id="tituloTabela">🗂️ Itens em Exibição</h3>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead style="background-color: #ffcfdf; color: #ff1493;">
                                <tr>
                                    <th>Aparência</th>
                                    <th>Nome</th>
                                    <th>Descrição / Dados</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaItensCRUD">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p>&copy; 2026 - Ilone Letícia - Área Administrativa.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cadastrar.js"></script>
</body>
</html>
