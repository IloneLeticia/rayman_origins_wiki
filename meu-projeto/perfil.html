<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Rayman Origins Wiki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
   
</head>
<body class="bg-light">

    <nav class="navbar bg-warning p-2 shadow-sm">
        <div class="container-fluid">
            <a href="index.html" class="btn btn-dark rounded-pill fw-bold">← Voltar para Home</a>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 700px;">
        <div class="bg-white p-4 rounded shadow-sm border text-center mb-4">
            <div class="mb-3">
                <img id="avatarAtual" src="imagens/avatar.png" alt="Avatar" class="rounded-circle border" style="width: 120px; height: 120px; object-fit: cover;">
                <h4 id="nomeUsuarioPerfil" class="mt-3 font-weight-bold text-dark">Nome do Usuário</h4>
            </div>

            <button class="btn btn-sm btn-outline-secondary rounded-pill mb-3" onclick="toggleOpcoesFoto()">📷 Alterar Foto de Perfil</button>

            <div id="secaoFotos" class="d-none border p-3 rounded mb-3 bg-light">
                <h6 class="text-secondary mb-2">Escolha um Avatar:</h6>
                <div class="d-flex justify-content-around">
                    <img src="foto-de-perfil/edith-up.jpg" class="rounded-circle border p-1" style="width: 50px; height: 50px; cursor: pointer;" onclick="mudarAvatar('foto-de-perfil/edith-up.jpg')">
                    <img src="foto-de-perfil/Helena Handbasket .jpg" class="rounded-circle border p-1" style="width: 50px; height: 50px; cursor: pointer;" onclick="mudarAvatar('foto-de-perfil/Helena Handbasket .jpg')">
                    <img src="foto-de-perfil/Holly Luya, the Music Nymph.png" class="rounded-circle border p-1" style="width: 50px; height: 50px; cursor: pointer;" onclick="mudarAvatar('foto-de-perfil/Holly Luya, the Music Nymph.png')">
                    <img src="foto-de-perfil/voddo mama - Rayman.png" class="rounded-circle border p-1" style="width: 50px; height: 50px; cursor: pointer;" onclick="mudarAvatar('foto-de-perfil/voddo mama - Rayman.png')">
                </div>
            </div>

            <div class="mb-4 text-start">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label font-weight-bold text-secondary m-0">Minha Bio:</label>
                    <button id="btnEditarBio" class="btn btn-sm btn-link text-decoration-none p-0" style="color: #ff1493;" onclick="ativarEdicaoBio()">✏️ Editar Bio</button>
                </div>
                
                <p id="textoBio" class="border p-3 rounded bg-light text-secondary" style="white-space: pre-line; min-height: 80px;">Nenhuma biografia adicionada ainda...</p>
                
                <textarea id="bioUsuario" class="form-control d-none" rows="3" placeholder="Conte um pouco sobre você..."></textarea>
            </div>

            <button id="btnSalvarPerfil" onclick="salvarPerfil()" class="w-100 py-2 btn btn-success text-white font-weight-bold rounded-pill d-none">SALVAR PERFIL</button>
        </div>

        <div class="bg-white p-4 rounded shadow-sm border">
            <h5 class="font-weight-bold text-dark mb-3">⭐ Meus Subitens Favoritos</h5>
            <div class="row row-cols-1 row-cols-sm-2 g-3" id="container-favoritos-perfil">
                </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
