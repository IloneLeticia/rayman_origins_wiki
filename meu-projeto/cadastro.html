<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayman Origins Archive - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="inicial.css">
</head>
<body>

    <header>
        <p>RAYMAN ORIGINS WIKI</p>
    </header>

    <main id="tela" class="my-auto">
        <div class="boas-vindas mb-4">
            <h2>📝 Criar Conta</h2>
            <p>Cadastre-se para salvar seu progresso na Wiki.</p>
        </div>

        <form id="formCadastro" class="text-start">
            <div class="mb-3">
                <label for="cadUsuario" class="form-label font-weight-bold">Escolha um Usuário:</label>
                <input type="text" class="form-control rounded-pill" id="cadUsuario" required placeholder="Ex: RaymanFã">
            </div>
            
            <div class="mb-4">
                <label for="cadSenha" class="form-label font-weight-bold">Crie uma Senha:</label>
                <input type="password" class="form-control rounded-pill" id="cadSenha" required placeholder="Mínimo 4 caracteres">
            </div>

            <div class="grupo-botoes">
                <button type="submit" class="w-100">CADASTRAR</button>
                <a href="login.html" class="btn btn-link text-decoration-none small text-center mt-2" style="color: #ff1493;">Já tem uma conta? Faça Login</a>
                <a href="inicial.html" class="btn btn-link text-decoration-none small text-center text-secondary">Voltar para a Home</a>
            </div>
        </form>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto w-100">
        <p>&copy; 2026 - Ilone Letícia - Fins acadêmicos.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
